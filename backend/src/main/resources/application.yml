server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

spring:
  application:
    name: liberate-auth-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/liberatedb}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:n0m3l0}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:live.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

# Security & JWT Configuration
app:
  mail:
    from: ${MAIL_FROM:Libérate <soporte@luminar.top>}
    frontend-url: ${FRONTEND_URL:https://liberate.luminar.top}
    mailtrap:
      api-token: ${MAILTRAP_API_TOKEN:}
      domain: ${MAILTRAP_DOMAIN:luminar.top}

  jwt:
    # 256-bit secure key (supplied via JWT_SECRET in .env)
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItbGliZXJhdGUtYXBw}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: liberate-auth-service

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  rate-limiting:
    login-max-attempts: 5
    window-minutes: 15

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://liberate.luminar.top,https://luminar.top,http://localhost:8081,http://localhost:19006,http://localhost:3000,http://localhost:8080,exp://*}
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "Origin"
      - "X-Requested-With"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.liberate.auth: DEBUG
    org.springframework.security: INFO
