server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: liberate-auth-service

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:liberatedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Security & JWT Configuration
app:
  jwt:
    # 256-bit secure key (override with JWT_SECRET in production)
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItbGliZXJhdGUtYXBw}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: liberate-auth-service

  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}

  rate-limiting:
    login-max-attempts: 5
    window-minutes: 15

  cors:
    allowed-origins:
      - "http://localhost:8081"
      - "http://localhost:19006"
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "exp://*"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "Origin"
      - "X-Requested-With"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.liberate.auth: DEBUG
    org.springframework.security: INFO
