server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: liberate-auth-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/liberatedb}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:n0m3l0}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:live.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:${MAILTRAP_API_TOKEN:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Security & JWT Configuration
app:
  mail:
    from: ${MAIL_FROM:Libérate <soporte@luminar.top>}
    frontend-url: ${FRONTEND_URL:http://localhost:8081}
    mailtrap:
      api-token: ${MAILTRAP_API_TOKEN:}
      domain: ${MAILTRAP_DOMAIN:luminar.top}

  jwt:
    # 256-bit secure key (override with JWT_SECRET in production)
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTI1Ni1iaXQtc2VjcmV0LWtleS1mb3ItbGliZXJhdGUtYXBw}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: liberate-auth-service

  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}

  rate-limiting:
    login-max-attempts: 5
    window-minutes: 15

  cors:
    allowed-origins:
      - "http://localhost:8081"
      - "http://localhost:19006"
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "exp://*"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "Accept"
      - "Origin"
      - "X-Requested-With"
    allow-credentials: true

logging:
  level:
    root: INFO
    com.liberate.auth: DEBUG
    org.springframework.security: INFO
