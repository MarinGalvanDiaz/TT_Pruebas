services:
  # ---------------------------------------------------------------------------
  # 1. Base de Datos: PostgreSQL 17
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: liberate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liberatedb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-n0m3l0}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-liberatedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - liberate-network

  # ---------------------------------------------------------------------------
  # 2. Backend: Spring Boot 3.2 (Java 17)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liberate-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-liberatedb}
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-n0m3l0}
      JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:8080/api/content/faqs || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - liberate-network

  # ---------------------------------------------------------------------------
  # 3. Frontend: Expo SDK 57 Web servido con Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api}
        EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-}
    container_name: liberate-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - liberate-network

# -----------------------------------------------------------------------------
# Volúmenes y Redes Persistentes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: liberate_postgres_data

networks:
  liberate-network:
    name: liberate-network
    driver: bridge
